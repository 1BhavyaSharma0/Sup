services:
  - type: web
    name: learnsphere-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: learnsphere-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /tmp/learnsphere-uploads
      - key: CLIENT_ORIGIN
        sync: false
      - key: TEACHER_INVITE_CODE
        generateValue: true
      - key: SEED_DEMO
        value: "true"
