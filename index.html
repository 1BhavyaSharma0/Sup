<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

/* Screens */

.screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:opacity .8s;
}

/* Landing */

#landing{

background:linear-gradient(135deg,#111,#1a1a1a,#000);

}

#landing h1{

font-size:70px;

margin-bottom:30px;

animation:float 2s infinite ease-in-out;

}

button{

padding:18px 60px;

font-size:22px;

font-weight:600;

border:none;

border-radius:60px;

cursor:pointer;

background:#ff4d79;

color:white;

transition:.3s;

box-shadow:0 10px 35px rgba(255,50,120,.4);

}

button:hover{

transform:scale(1.08);

}

/* Video */

#videoScreen{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:#000;

display:none;

}

#player{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

object-fit:cover;

background:black;

}

/* Birthday */

#birthday{

display:none;

background:linear-gradient(135deg,#ffd6e5,#fff4b7,#ffd6e5);

overflow:hidden;

color:#222;

}

#birthday h1{

font-size:65px;

margin-bottom:20px;

}

#birthday p{

font-size:24px;

margin-bottom:40px;

}

/* Balloons */

.balloon{

position:absolute;

bottom:-150px;

font-size:55px;

animation:rise 12s linear infinite;

opacity:.9;

}

.balloon:nth-child(1){left:10%;animation-delay:0s;}
.balloon:nth-child(2){left:28%;animation-delay:2s;}
.balloon:nth-child(3){left:45%;animation-delay:5s;}
.balloon:nth-child(4){left:68%;animation-delay:1s;}
.balloon:nth-child(5){left:87%;animation-delay:3s;}

@keyframes rise{

0%{

transform:translateY(0);

}

100%{

transform:translateY(-130vh);

}

}

@keyframes float{

50%{

transform:translateY(-10px);

}

}

/* End */

#end{

display:none;

background:black;

color:white;

text-align:center;

}

#end h2{

font-size:55px;

margin-bottom:30px;

}

#end p{

font-size:24px;

line-height:1.8;

}

</style>

</head>

<body>

<!-- Landing -->

<div id="landing" class="screen">

<h1>🎁</h1>

<button onclick="start()">Click Me</button>

</div>

<!-- Video -->

<div id="videoScreen">

<video
id="player"
autoplay
playsinline
preload="auto"
disablepictureinpicture
controlslist="nodownload nofullscreen noremoteplayback">
</video>

</div>

<!-- Birthday -->

<div id="birthday" class="screen">

<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>

<h1>🎉 Happy Birthday 🎉</h1>

<p>One last surprise is waiting for you ❤️</p>

<button onclick="playFinal()">🎁 Open Your Gift</button>

</div>

<!-- End -->

<div id="end" class="screen">

<h2>❤️ Happy Birthday ❤️</h2>

<p>

May your life always be filled with<br>

love, laughter,<br>

happiness and beautiful memories.

</p>

</div>

<script>

const landing=document.getElementById("landing");
const birthday=document.getElementById("birthday");
const end=document.getElementById("end");
const videoScreen=document.getElementById("videoScreen");
const player=document.getElementById("player");

player.controls=false;

let stage=1;

function fade(element){

element.style.opacity=0;

setTimeout(()=>{

element.style.display="none";

},600);

}

function show(element){

element.style.display="flex";

setTimeout(()=>{

element.style.opacity=1;

},50);

}

function start(){

fade(landing);

setTimeout(()=>{

videoScreen.style.display="block";

player.src="video1.mp4";

player.play();

},700);

}

player.onended=function(){

if(stage==1){

stage=2;

player.src="video2.mp4";

player.play();

}

else if(stage==2){

videoScreen.style.display="none";

show(birthday);

}

else if(stage==3){

videoScreen.style.display="none";

show(end);

}

}

function playFinal(){

fade(birthday);

setTimeout(()=>{

videoScreen.style.display="block";

stage=3;

player.src="video3.mp4";

player.play();

},700);

}

</script>

</body>
</html>
